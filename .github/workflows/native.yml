name: Native plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev
      - run: cmake -S plugin -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel 2
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - if: runner.os == 'Windows'
        run: node scripts/verify-native-api.cjs build/native/Release/processor_test.exe
      - if: runner.os == 'Windows'
        run: node scripts/verify-native-failures.cjs build/native/Release/processor_test.exe
      - if: runner.os == 'Linux'
        run: node scripts/verify-native-api.cjs build/native/processor_test
      - if: runner.os == 'Linux'
        run: node scripts/verify-native-failures.cjs build/native/processor_test
      - if: runner.os == 'Windows'
        run: node scripts/verify-composer-worker.cjs build/native/Release/composer_processor_test.exe
      - if: runner.os == 'Linux'
        run: node scripts/verify-composer-worker.cjs build/native/composer_processor_test
      - name: Package tested Windows candidate
        if: runner.os == 'Windows'
        run: node scripts/package-native.cjs --build-dir build/native --juce-dir build/native/_deps/juce-src --output dist/native-candidate --platform windows
      - name: Package tested Linux candidate
        if: runner.os == 'Linux'
        run: node scripts/package-native.cjs --build-dir build/native --juce-dir build/native/_deps/juce-src --output dist/native-candidate --platform linux
      - name: Upload candidate ZIP and checksums
        uses: actions/upload-artifact@v4
        with:
          name: LoopForge-${{ runner.os }}-${{ github.sha }}-candidate
          path: |
            dist/native-candidate/*.zip
            dist/native-candidate/SHA256SUMS
          if-no-files-found: error

  publish-test-release:
    name: Publish tested Windows alpha
    needs: native
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LoopForge-Windows-${{ github.sha }}-candidate
          path: release-input
      - name: Verify ZIP and publish immutable alpha
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-input && sha256sum --check SHA256SUMS)
          mapfile -t archives < <(find release-input -maxdepth 1 -type f -name '*.zip')
          test "${#archives[@]}" -eq 1
          release_tag=v0.2.0-alpha.1
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing alpha preserved; choose a new version for another release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq '.object.sha' 2>/dev/null); then
            test "$tag_sha" = "$GITHUB_SHA" || { echo 'Existing tag points elsewhere; refusing replacement.'; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$release_tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          gh release create "$release_tag" "${archives[0]}" release-input/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'LoopForge 0.2.0-alpha.1 — Windows EXE + VST3 test' \
            --notes-file docs/releases/0.2.0-alpha.1.md --prerelease --latest=false
