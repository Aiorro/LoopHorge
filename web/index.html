<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>LOOPFORGE / AI MIDI Composer</title><link rel="stylesheet" href="/style.css"/></head>
<body>
<a class="skip-link" href="#content">Skip to composer</a>
<div class="shell">
  <header class="instrument-head">
    <h1 id="content" tabindex="-1">LoopForge</h1>
    <nav aria-label="Studio"><a class="nav" href="#studio">Composer</a><a class="nav" href="#editor">Piano roll</a><a class="nav" href="#connection">Connection</a></nav>
  </header>
  <main class="main">
    <section class="workspace" id="studio" aria-label="Loop generation">
      <div class="fields">
        <label for="style">GENRE<select id="style"><option value="trap">Trap / Dark</option><option value="boom-bap">Boom Bap</option><option value="r&b">R&B / Soul</option><option value="ambient">Ambient / Cinematic</option><option value="nu-metal">Nu Metal</option></select></label>
        <label for="key">ROOT NOTE<select id="key"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select></label>
        <label for="mode">SCALE<select id="mode"><option value="minor">Minor</option><option value="major">Major</option><option value="dorian">Dorian</option><option value="phrygian">Phrygian</option></select></label>
        <label for="bpm">TEMPO<div class="input-unit"><input id="bpm" required type="number" min="40" max="240" value="105"/><span>BPM</span></div></label>
        <label for="bars">LENGTH<select id="bars"><option value="4">4 Bars</option><option value="8">8 Bars</option></select></label>
      </div>
      <div class="command-row"><div class="prompt-label"><label for="description">MUSICAL DIRECTION</label><textarea id="description" rows="1" maxlength="600" placeholder="Describe a loop for an AI engine"></textarea></div><button class="primary" id="generate"><span aria-hidden="true">✦</span> GENERATE 8 IDEAS <span aria-hidden="true">→</span></button><button class="outline" id="play">▶ PREVIEW</button></div>
      <details class="engine-options"><summary>Engine settings</summary><div class="gen-options"><label for="provider">ENGINE<select id="provider"><option value="offline">Offline composer</option><option value="codex-cli">OpenAI account / Codex CLI</option><option value="claude-cli">Claude account / Claude Code CLI</option><option value="openai">OpenAI API</option><option value="anthropic">Claude / Anthropic</option><option value="openrouter">OpenRouter</option><option value="ollama">Ollama / Local LLM</option></select></label><label for="model">MODEL <input id="model" placeholder="Provider default" spellcheck="false"/></label></div></details>
      <div id="message" role="status" class="message" aria-live="polite">Ready to generate your first eight ideas.</div>
    </section>
    <section class="ideas-section" aria-label="Generated ideas"><div class="loop-field"><div class="field-caption"><span id="fieldIdea"></span><h2 id="fieldKey"></h2><p id="fieldTiming"></p></div></div><div class="idea-grid" id="ideas"></div></section>
    <section class="editor-section" id="editor"><div class="section-head"><div><h2>Piano roll</h2></div><button class="outline" id="download">↓ EXPORT MIDI</button><div class="edit-tip" id="note-help">ARROWS MOVE · SHIFT + ← / → RESIZE · DELETE REMOVES</div></div><div class="layers"><button class="layer selected bass" data-layer="bass" aria-pressed="true"><span></span>BASS <small id="nbass">0 NOTES</small></button><button class="layer chords" data-layer="chords" aria-pressed="false"><span></span>CHORDS <small id="nchords">0 NOTES</small></button><button class="layer melody" data-layer="melody" aria-pressed="false"><span></span>MELODY <small id="nmelody">0 NOTES</small></button><div class="edit-actions"><button class="outline small-button" id="octdown">−12</button><button class="outline small-button" id="octup">+12</button></div></div><div class="piano-wrap" tabindex="0" role="region" aria-label="Scrollable piano roll" aria-describedby="note-help"><div class="piano-surface"><div class="piano" id="piano" aria-hidden="true"></div><div class="roll-scroll"><div class="roll" id="roll"></div></div></div></div><div class="note-inspector"><label for="noteSelect">NOTE<select id="noteSelect"></select></label><label for="notePitch">PITCH (MIDI)<input id="notePitch" type="number" min="0" max="127" step="1" required></label><label for="noteStart">START (BEATS)<input id="noteStart" type="number" min="0" step="0.001" required></label><label for="noteDuration">LENGTH (BEATS)<input id="noteDuration" type="number" min="0.001" step="0.001" required></label><div class="note-actions"><button class="outline" id="addNote">ADD NOTE</button><button class="outline" id="deleteNote">DELETE NOTE</button></div></div><div class="editor-footer"><span>4/4 · ¼ BEAT GRID</span><span id="note-info">SELECT AN IDEA TO EDIT</span><button id="exportLayer" class="text-button">EXPORT SELECTED IDEA ↗</button></div></section>
    <section class="provider-section" id="connection"><div><h2>AI connection</h2><p id="connectionStatus">Checking provider…</p></div><div class="provider-list" id="providerStatus"></div></section>

  </main>
</div>
<script src="/core.js"></script><script src="/app.js"></script>
</body></html>
